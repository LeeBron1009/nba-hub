<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Hub</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
body{background:#10131a;color:#eee;padding-bottom:70px}
header{position:sticky;top:0;background:#1b2130;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.home{display:flex;align-items:center;gap:6px;cursor:pointer}
.home h1{font-size:18px}
#lang{background:#c8102e;color:#fff;border:0;padding:6px 12px;border-radius:14px;font-weight:bold;cursor:pointer}
main{padding:12px;max-width:700px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#1b2130;display:flex;z-index:5}
nav button{flex:1;padding:12px 0;background:none;border:0;color:#999;font-size:13px;cursor:pointer}
nav button.on{color:#fff;border-top:3px solid #c8102e}
.card{background:#1b2130;border-radius:12px;padding:12px;margin-bottom:10px}
.game{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.team{display:flex;align-items:center;gap:8px}
.team img{width:28px;height:28px}
.sc{font-size:20px;font-weight:bold}
.st{font-size:12px;color:#8fa;margin-bottom:4px}
.live{color:#ff5a5a}
input{width:100%;padding:10px;border-radius:10px;border:0;margin-bottom:10px;background:#252c3d;color:#fff;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
td,th{padding:5px 6px;text-align:right}
td:first-child,th:first-child{text-align:left}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;background:#252c3d;color:#ccc;border:0;padding:10px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.tabs button.on{background:#c8102e;color:#fff}
.nb{background:#252c3d;color:#fff;border:0;padding:8px;border-radius:8px;cursor:pointer}
a{color:#7cc4ff}
.news img{width:100%;border-radius:8px;margin-bottom:6px}
.back{background:none;border:0;color:#7cc4ff;margin-bottom:8px;font-size:15px;cursor:pointer}
.big{display:flex;align-items:center;gap:12px}
.big img{width:70px;height:70px;border-radius:50%;background:#252c3d;object-fit:cover}
.big img.logo{border-radius:0;background:none;object-fit:contain}
.err{color:#f88;padding:20px;text-align:center}
.err small{display:block;color:#a66;margin-top:6px}
.win{color:#5f5}.lose{color:#f77}
.top6{color:#22c55e;font-weight:bold}.mid{color:#38bdf8;font-weight:bold}
</style>
</head>
<body>
<header><div class="home" onclick="goHome()"><span style="font-size:20px">🏀</span><h1>NBA Hub</h1></div><button id="lang" onclick="toggleLang()">中文</button></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const T={
en:{scores:"Scores",standings:"Standings",teams:"Teams",players:"Players",news:"News",
 prev:"◀ Prev",next:"Next ▶",loading:"Loading...",err:"Failed to load data. Check your network.",
 nogame:"No games on this day.",live:"LIVE",final:"Final",back:"← Back",search:"Search player (e.g. LeBron)",
 east:"Eastern",west:"Western",team:"Team",w:"W",l:"L",pct:"PCT",gb:"GB",streak:"Streak",
 box:"Box Score",roster:"Roster",seasonStats:"Season Stats",gameLog:"Game Log (This Season)",pos:"Pos",age:"Age",ht:"Height",
 noresult:"No result.",readmore:"Read more",auto:"Auto refresh every 30s",tapNote:"Tap a game for details",
 date:"Date",opp:"OPP",result:"Result",nolog:"No game log available.",
 "Regular Season":"Regular Season","Career":"Career"},
zh:{scores:"比分",standings:"排名",teams:"球隊",players:"球員",news:"新聞",
 prev:"◀ 前一天",next:"後一天 ▶",loading:"載入中...",err:"資料載入失敗，請檢查網路。",
 nogame:"這天沒有比賽。",live:"進行中",final:"結束",back:"← 返回",search:"搜尋球員（例如 LeBron）",
 east:"東區",west:"西區",team:"球隊",w:"勝",l:"敗",pct:"勝率",gb:"勝差",streak:"連勝/連敗",
 box:"球員數據",roster:"陣容",seasonStats:"賽季數據",gameLog:"本賽季逐場表現",pos:"位置",age:"年齡",ht:"身高",
 noresult:"找不到結果。",readmore:"閱讀全文",auto:"每 30 秒自動更新",tapNote:"點選比賽看詳細資料",
 date:"日期",opp:"對手",result:"結果",nolog:"目前沒有逐場資料。",
 "Regular Season":"例行賽","Career":"生涯"}
};
const TEAMZH={ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",CHA:"黃蜂",CHI:"公牛",CLE:"騎士",DAL:"獨行俠",DEN:"金塊",DET:"活塞",GS:"勇士",GSW:"勇士",HOU:"火箭",IND:"溜馬",LAC:"快艇",LAL:"湖人",MEM:"灰熊",MIA:"熱火",MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",NOP:"鵜鶘",NY:"尼克",NYK:"尼克",OKC:"雷霆",ORL:"魔術",PHI:"七六人",PHX:"太陽",POR:"拓荒者",SAC:"國王",SA:"馬刺",SAS:"馬刺",TOR:"暴龍",UTA:"爵士",UTAH:"爵士",WSH:"巫師",WAS:"巫師"};
const POSZH={PG:"控球後衛",SG:"得分後衛",SF:"小前鋒",PF:"大前鋒",C:"中鋒",G:"後衛",F:"前鋒"};

let lang=localStorage.getItem("nbaLang")||"en";
let tab="scores",date=new Date(),timer=null,view=null,pview=null,conf="east",boxIdx=0,gameData=null,teamsCache=null;
const t=k=>T[lang][k]||k;
const tn=(abbr,name)=>lang==="zh"&&TEAMZH[abbr]?TEAMZH[abbr]:name;
const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const STAND="https://site.api.espn.com/apis/v2/sports/basketball/nba/standings";
const PL="https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/";
const $=document.getElementById("app");

async function get(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const showErr=e=>{$.innerHTML=`<div class="err">${t("err")}<small>${e&&e.message?e.message:""}</small></div>`};

function toggleLang(){lang=lang==="en"?"zh":"en";localStorage.setItem("nbaLang",lang);document.documentElement.lang=lang==="zh"?"zh-Hant":"en";render()}
function goHome(){tab="scores";view=null;pview=null;boxIdx=0;date=new Date();render();window.scrollTo(0,0)}
function drawNav(){
 const items=[["scores","🏀"],["standings","📊"],["teams","🛡️"],["players","👤"],["news","📰"]];
 document.getElementById("nav").innerHTML=items.map(([k,i])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${i}<br>${t(k)}</button>`).join("");
 document.getElementById("lang").textContent=lang==="en"?"中文":"English";
}
function go(k){tab=k;view=null;pview=null;render()}
function render(){
 clearInterval(timer);drawNav();
 $.innerHTML=`<div class="card">${t("loading")}</div>`;
 const f={scores:pgScores,standings:pgStandings,teams:pgTeams,players:pgPlayers,news:pgNews}[tab];
 f().catch(showErr);
}

/* SCORES */
async function pgScores(){
 if(view)return pgGame(view);
 const load=async()=>{
  const d=await get(`${API}/scoreboard?dates=${ymd(date)}`);
  const ev=d.events||[];
  let h=`<div class="row"><button class="nb" onclick="shift(-1)">${t("prev")}</button>
   <b style="cursor:pointer" onclick="date=new Date();render()">${date.toLocaleDateString(lang==="zh"?"zh-TW":"en-US",{month:"short",day:"numeric",weekday:"short"})}</b>
   <button class="nb" onclick="shift(1)">${t("next")}</button></div>
   <p style="font-size:12px;color:#889;margin:6px 0">${t("auto")} · ${t("tapNote")}</p>`;
  if(!ev.length)h+=`<div class="card">${t("nogame")}</div>`;
  h+=ev.map(e=>{
   const c=e.competitions[0],s=e.status.type,live=s.state==="in";
   const st=live?`<span class="live">● ${t("live")} ${e.status.displayClock||""} Q${e.status.period}</span>`:
     s.state==="post"?t("final"):new Date(e.date).toLocaleTimeString(lang==="zh"?"zh-TW":"en-US",{hour:"2-digit",minute:"2-digit"});
   const tm=c.competitors.slice().sort((a,b)=>a.homeAway==="away"?-1:1).map(x=>`
    <div class="row"><div class="team"><img src="${x.team.logo||""}"><span>${tn(x.team.abbreviation,x.team.displayName)}</span><small style="color:#889">${x.records?.[0]?.summary||""}</small></div>
    <span class="sc">${s.state==="pre"?"":x.score}</span></div>`).join("");
   return `<div class="card game" onclick="view='${e.id}';boxIdx=0;render()"><div class="st">${st}</div>${tm}</div>`}).join("");
  $.innerHTML=h;
 };
 await load();
 timer=setInterval(()=>load().catch(()=>{}),30000);
}
function shift(n){date.setDate(date.getDate()+n);render()}

function drawGame(){
 const d=gameData;
 let h=`<button class="back" onclick="view=null;render()">${t("back")}</button>`;
 const c=d.header?.competitions?.[0];
 if(c)h+=`<div class="card">`+c.competitors.slice().sort((a,b)=>a.homeAway==="away"?-1:1).map(x=>`<div class="row"><div class="team"><img src="${x.team.logos?.[0]?.href||""}"><b>${tn(x.team.abbreviation,x.team.displayName)}</b></div><span class="sc">${x.score||""}</span></div>`).join("")+`</div>`;
 const pl=d.boxscore?.players||[];
 if(pl.length){
  if(boxIdx>=pl.length)boxIdx=0;
  h+=`<div class="tabs">`+pl.map((tp,i)=>`<button class="${i===boxIdx?"on":""}" onclick="boxIdx=${i};drawGame()">${tn(tp.team.abbreviation,tp.team.shortDisplayName||tp.team.displayName)}</button>`).join("")+`</div>`;
  const tp=pl[boxIdx],st=tp.statistics?.[0];
  if(st){
   const lab=st.labels;
   h+=`<div class="card"><b>${tn(tp.team.abbreviation,tp.team.displayName)} · ${t("box")}</b><div class="scroll"><table><tr><th></th>${lab.map(l=>`<th>${l}</th>`).join("")}</tr>`+
   st.athletes.map(a=>`<tr><td>${a.athlete.shortName}</td>${(a.stats.length?a.stats:lab.map(()=>"-")).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")+`</table></div></div>`;
  }
 }else h+=`<div class="card">${t("nogame")}</div>`;
 $.innerHTML=h;
}
async function pgGame(id){
 gameData=await get(`${API}/summary?event=${id}`);
 drawGame();
 timer=setInterval(async()=>{
  if(tab==="scores"&&view){try{gameData=await get(`${API}/summary?event=${view}`);drawGame()}catch(e){}}
 },30000);
}

/* STANDINGS */
async function pgStandings(){
 const d=await get(STAND);
 const kids=d.children||[];
 const c=kids.find(k=>conf==="east"?/east/i.test(k.name):/west/i.test(k.name))||kids[0];
 const gs=(e,n)=>e.stats.find(s=>s.name===n)?.displayValue??"-";
 const seed=x=>+(x.stats.find(s=>s.name==="playoffSeed")?.value||99);
 const en=c.standings.entries.slice().sort((a,b)=>seed(a)-seed(b));
 let h=`<div class="tabs"><button class="${conf==="east"?"on":""}" onclick="conf='east';render()">${t("east")}</button>
  <button class="${conf==="west"?"on":""}" onclick="conf='west';render()">${t("west")}</button></div>
  <div class="card"><div class="scroll"><table><tr><th>${t("team")}</th><th>${t("w")}</th><th>${t("l")}</th><th>${t("pct")}</th><th>${t("gb")}</th><th>${t("streak")}</th></tr>`+
 en.map((e,i)=>`<tr><td><span class="${i<6?"top6":i<10?"mid":""}">${i+1}.</span> <img src="${e.team.logos?.[0]?.href||""}" width="18" style="vertical-align:middle"> ${tn(e.team.abbreviation,e.team.shortDisplayName)}</td><td>${gs(e,"wins")}</td><td>${gs(e,"losses")}</td><td>${gs(e,"winPercent")}</td><td>${gs(e,"gamesBehind")}</td><td>${gs(e,"streak")}</td></tr>`).join("")+`</table></div></div>`;
 $.innerHTML=h;
}

/* TEAMS */
async function getTeams(){
 if(teamsCache)return teamsCache;
 let out=[];
 try{
  const d=await get(STAND);
  (d.children||[]).forEach(c=>c.standings.entries.forEach(e=>{
   out.push(Object.assign({},e.team,{_rec:(e.stats.find(s=>s.name==="wins")?.displayValue||"0")+"-"+(e.stats.find(s=>s.name==="losses")?.displayValue||"0")}));
  }));
 }catch(e){}
 if(!out.length){
  const d=await get(`${API}/teams`);
  out=d.sports[0].leagues[0].teams.map(x=>x.team);
 }
 teamsCache=out;return out;
}
const logoOf=x=>x?.logos?.[0]?.href||(x?.abbreviation?`https://a.espncdn.com/i/teamlogos/nba/500/${x.abbreviation.toLowerCase()}.png`:"");
async function pgTeams(){
 if(pview)return pgPlayer(pview,true);
 if(view)return pgTeam(view);
 const ts=(await getTeams()).slice().sort((a,b)=>(a.displayName||"").localeCompare(b.displayName||""));
 $.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`+ts.map(x=>`<div class="card game" style="text-align:center" onclick="view='${x.id}';render()"><img src="${logoOf(x)}" width="48"><div>${tn(x.abbreviation,x.displayName)}</div></div>`).join("")+`</div>`;
}
async function pgTeam(id){
 const list=await getTeams();
 const x=list.find(z=>String(z.id)===String(id))||{};
 let ath=[];
 try{ath=(await get(`${API}/teams/${id}/roster`)).athletes||[]}catch(e){
  try{ath=(await get(`${API}/teams/${id}?enable=roster`)).team.athletes||[]}catch(e2){}
 }
 if(ath.length&&ath[0].items)ath=ath.flatMap(g=>g.items);
 let h=`<button class="back" onclick="view=null;render()">${t("back")}</button>
 <div class="card big"><img class="logo" src="${logoOf(x)}"><div><h2>${tn(x.abbreviation,x.displayName||"")}</h2><div style="color:#9ab">${x._rec||""}</div></div></div>
 <div class="card"><b>${t("roster")}</b><div class="scroll"><table><tr><th></th><th>${t("pos")}</th><th>${t("age")}</th><th>${t("ht")}</th></tr>`+
 ath.map(a=>`<tr onclick="openPlayer('${a.id}')" style="cursor:pointer"><td>#${a.jersey||"-"} ${a.fullName}</td><td>${lang==="zh"?(POSZH[a.position?.abbreviation]||a.position?.abbreviation||""):a.position?.abbreviation||""}</td><td>${a.age||""}</td><td>${a.displayHeight||""}</td></tr>`).join("")+`</table></div></div>`;
 $.innerHTML=h;
}
function openPlayer(id){pview=id;render();window.scrollTo(0,0)}

/* PLAYERS */
async function pgPlayers(){
 if(view)return pgPlayer(view,false);
 $.innerHTML=`<input id="q" placeholder="${t("search")}" oninput="doSearch(this.value)"><div id="res"></div>`;
}
let st;
function doSearch(v){
 clearTimeout(st);
 st=setTimeout(async()=>{
  const res=document.getElementById("res");if(v.length<2){res.innerHTML="";return}
  try{
   const d=await get(`https://site.web.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(v)}&limit=10&type=player&sport=basketball&league=nba`);
   const it=d.items||[];
   res.innerHTML=it.length?it.map(p=>`<div class="card game" onclick="view='${p.id}';render()"><b>${p.displayName}</b><div style="color:#9ab;font-size:13px">${p.subtitle||""}</div></div>`).join(""):`<div class="card">${t("noresult")}</div>`;
  }catch(e){res.innerHTML=`<div class="err">${t("err")}</div>`}
 },400);
}
async function pgPlayer(id,fromTeam){
 const [o,b,g]=await Promise.all([
  get(`${PL}${id}/overview`).catch(()=>({})),
  get(`${PL}${id}`).catch(()=>null),
  get(`${PL}${id}/gamelog`).catch(()=>null)]);
 const a=b?.athlete||{};
 let sched=null;
 if(a.team?.id){sched=await get(`${API}/teams/${a.team.id}/schedule`).catch(()=>null)}
 const backJs=fromTeam?"pview=null;render()":"view=null;render()";
 let h=`<button class="back" onclick="${backJs}">${t("back")}</button>
 <div class="card big"><img src="${a.headshot?.href||""}"><div><h2>${a.displayName||""}</h2>
 <div style="color:#9ab">${a.team?tn(a.team.abbreviation,a.team.displayName):""} · #${a.jersey||"-"} · ${lang==="zh"?(POSZH[a.position?.abbreviation]||""):a.position?.displayName||""}</div>
 <div style="color:#9ab;font-size:13px">${a.displayHeight||""} · ${a.displayWeight||""} · ${a.age||""}</div></div></div>`;
 const s=o.statistics;
 if(s){
  h+=`<div class="card"><b>${t("seasonStats")}</b><div class="scroll"><table><tr><th></th>${s.labels.map(l=>`<th>${l}</th>`).join("")}</tr>`+
  s.splits.map(sp=>`<tr><td>${t(sp.displayName)}</td>${sp.stats.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")+`</table></div></div>`;
 }
 h+=gameLogHtml(g,id,sched,a.team?.id);
 $.innerHTML=h;
 fillPM(id);
}
function gameLogHtml(g,pid,sched,teamId){
 const none=`<div class="card"><b>${t("gameLog")}</b><p style="margin-top:6px;color:#9ab">${t("nolog")}</p></div>`;
 if(!g||!g.labels||!g.events)return none;
 const rows=[],seen=new Set();
 (g.seasonTypes||[]).forEach(stp=>{
  if(/post|pre/i.test(stp.displayName||""))return;
  (stp.categories||[]).forEach(cat=>{
   (cat.events||[]).forEach(ev=>{
    const meta=g.events[ev.eventId];
    if(meta){rows.push({meta,stats:ev.stats,eventId:ev.eventId,dnp:false});seen.add(String(ev.eventId))}
   });
  });
 });
 (sched?.events||[]).forEach(e=>{
  const c=e.competitions?.[0];
  if(!c)return;
  const done=e.status?.type?.completed??c.status?.type?.completed;
  if(!done||seen.has(String(e.id)))return;
  const me=c.competitors.find(x=>String(x.team.id)===String(teamId));
  const op=c.competitors.find(x=>String(x.team.id)!==String(teamId));
  if(!me||!op)return;
  const ms=+(me.score?.displayValue??me.score),os=+(op.score?.displayValue??op.score);
  const win=me.winner===true||ms>os;
  rows.push({dnp:true,eventId:e.id,stats:g.labels.map(()=>"-"),
   meta:{gameDate:e.date,atVs:me.homeAway==="away"?"@":"vs",opponent:op.team,gameResult:win?"W":"L",score:`${ms}-${os}`}});
 });
 rows.sort((x,y)=>new Date(y.meta.gameDate||0)-new Date(x.meta.gameDate||0));
 if(!rows.length)return none;
 const loc=lang==="zh"?"zh-TW":"en-US";
 return `<div class="card"><b>${t("gameLog")}</b><div class="scroll" style="margin-top:6px"><table><tr><th>${t("date")}</th><th>${t("opp")}</th><th>${t("result")}</th>${g.labels.map(l=>`<th>${l}</th>`).join("")}<th>+/-</th></tr>`+
 rows.map(r=>{
  const m=r.meta,d=new Date(m.gameDate);
  const opp=m.opponent?tn(m.opponent.abbreviation,m.opponent.displayName):"";
  const w=m.gameResult==="W";
  return `<tr><td>${isNaN(d)?"":d.toLocaleDateString(loc,{month:"numeric",day:"numeric"})}</td><td>${m.atVs||""} ${opp}</td><td class="${w?"win":"lose"}">${m.gameResult||""} ${m.score||""}</td>${r.stats.map(v=>`<td>${v}</td>`).join("")}${r.dnp?`<td>-</td>`:`<td class="pm" data-ev="${r.eventId}">…</td>`}</tr>`;
 }).join("")+`</table></div></div>`;
}
const pmCache={};
function findPM(d,pid){
 for(const tp of (d.boxscore?.players||[])){
  const st=tp.statistics?.[0];if(!st)continue;
  const idx=st.labels.indexOf("+/-");
  const a=st.athletes.find(x=>String(x.athlete.id)===String(pid));
  if(a&&idx>=0&&a.stats[idx]!==undefined)return a.stats[idx];
 }
 return null;
}
function setPM(c,v){
 c.textContent=v||"-";
 c.className="pm "+(v&&String(v).startsWith("+")?"win":v&&String(v).startsWith("-")?"lose":"");
}
async function fillPM(pid){
 const ids=[...new Set([...document.querySelectorAll(".pm")].map(c=>c.dataset.ev))];
 let i=0;
 async function worker(){
  while(i<ids.length){
   const ev=ids[i++],key=pid+"_"+ev;
   if(!(key in pmCache)){
    try{pmCache[key]=findPM(await get(`${API}/summary?event=${ev}`),pid)}catch(e){pmCache[key]=null}
   }
   document.querySelectorAll(`.pm[data-ev="${ev}"]`).forEach(c=>setPM(c,pmCache[key]));
  }
 }
 await Promise.all([worker(),worker(),worker(),worker()]);
}

/* NEWS */
async function pgNews(){
 const d=await get(`${API}/news?limit=20`);
 $.innerHTML=(d.articles||[]).map(a=>`<div class="card news">${a.images?.[0]?`<img src="${a.images[0].url}">`:""}<b>${a.headline}</b><p style="font-size:13px;color:#aab;margin:6px 0">${a.description||""}</p><a href="${a.links?.web?.href}" target="_blank" rel="noopener">${t("readmore")}</a></div>`).join("")||`<div class="card">${t("noresult")}</div>`;
}
document.documentElement.lang=lang==="zh"?"zh-Hant":"en";
render();
</script>
</body>
</html>
