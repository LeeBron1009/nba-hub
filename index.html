<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Hub</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,"Noto Sans TC",sans-serif}
body{background:#10131a;color:#eee;padding-bottom:70px}
header{position:sticky;top:0;background:#1b2130;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:18px}
#lang{background:#c8102e;color:#fff;border:0;padding:6px 12px;border-radius:14px;font-weight:bold}
main{padding:12px;max-width:700px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#1b2130;display:flex;z-index:5}
nav button{flex:1;padding:12px 0;background:none;border:0;color:#999;font-size:13px}
nav button.on{color:#fff;border-top:3px solid #c8102e}
.card{background:#1b2130;border-radius:12px;padding:12px;margin-bottom:10px}
.game{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.team{display:flex;align-items:center;gap:8px}
.team img{width:28px;height:28px}
.sc{font-size:20px;font-weight:bold}
.st{font-size:12px;color:#8fa;margin-bottom:4px}
.live{color:#ff5a5a}
input{width:100%;padding:10px;border-radius:10px;border:0;margin-bottom:10px;background:#252c3d;color:#fff;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 4px;text-align:right}
td:first-child,th:first-child{text-align:left}
.scroll{overflow-x:auto}
.tabs button{background:#252c3d;color:#ccc;border:0;padding:6px 12px;border-radius:14px;margin:0 4px 8px 0}
.tabs button.on{background:#c8102e;color:#fff}
a{color:#7cc4ff}
.news img{width:100%;border-radius:8px;margin-bottom:6px}
.back{background:none;border:0;color:#7cc4ff;margin-bottom:8px;font-size:15px}
.big{display:flex;align-items:center;gap:12px}
.big img{width:70px;height:70px;border-radius:50%;background:#252c3d;object-fit:cover}
.err{color:#f88;padding:20px;text-align:center}
</style>
</head>
<body>
<header><h1>🏀 NBA Hub</h1><button id="lang" onclick="toggleLang()">中文</button></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const T={
en:{scores:"Scores",standings:"Standings",teams:"Teams",players:"Players",news:"News",
 prev:"◀ Prev",next:"Next ▶",today:"Today",loading:"Loading...",err:"Failed to load data. Check your network.",
 nogame:"No games on this day.",live:"LIVE",final:"Final",back:"← Back",search:"Search player (e.g. LeBron)",
 east:"Eastern",west:"Western",team:"Team",w:"W",l:"L",pct:"PCT",gb:"GB",streak:"Streak",
 box:"Box Score",leaders:"Leaders",roster:"Roster",seasonStats:"Season Stats",pos:"Pos",age:"Age",ht:"Height",
 noresult:"No result.",injuries:"Injuries",readmore:"Read more",min:"MIN",pts:"PTS",reb:"REB",ast:"AST",
 stl:"STL",blk:"BLK",to:"TO",auto:"Auto refresh every 30s",tapNote:"Tap a game for details"},
zh:{scores:"比分",standings:"排名",teams:"球隊",players:"球員",news:"新聞",
 prev:"◀ 前一天",next:"後一天 ▶",today:"今天",loading:"載入中...",err:"資料載入失敗，請檢查網路。",
 nogame:"這天沒有比賽。",live:"進行中",final:"終了",back:"← 返回",search:"搜尋球員（例如 LeBron）",
 east:"東區",west:"西區",team:"球隊",w:"勝",l:"敗",pct:"勝率",gb:"勝差",streak:"連勝/連敗",
 box:"球員數據",leaders:"數據王",roster:"陣容",seasonStats:"賽季數據",pos:"位置",age:"年齡",ht:"身高",
 noresult:"找不到結果。",injuries:"傷兵",readmore:"閱讀全文",min:"時間",pts:"得分",reb:"籃板",ast:"助攻",
 stl:"抄截",blk:"阻攻",to:"失誤",auto:"每 30 秒自動更新",tapNote:"點選比賽看詳細資料"}
};
const TEAMZH={ATL:"老鷹",BOS:"塞爾提克",BKN:"籃網",CHA:"黃蜂",CHI:"公牛",CLE:"騎士",DAL:"獨行俠",DEN:"金塊",DET:"活塞",GS:"勇士",GSW:"勇士",HOU:"火箭",IND:"溜馬",LAC:"快艇",LAL:"湖人",MEM:"灰熊",MIA:"熱火",MIL:"公鹿",MIN:"灰狼",NO:"鵜鶘",NOP:"鵜鶘",NY:"尼克",NYK:"尼克",OKC:"雷霆",ORL:"魔術",PHI:"七六人",PHX:"太陽",POR:"拓荒者",SAC:"國王",SA:"馬刺",SAS:"馬刺",TOR:"暴龍",UTA:"爵士",UTAH:"爵士",WSH:"巫師",WAS:"巫師"};
const POSZH={PG:"控球後衛",SG:"得分後衛",SF:"小前鋒",PF:"大前鋒",C:"中鋒",G:"後衛",F:"前鋒"};
const STATZH={"Points Per Game":"場均得分","Rebounds Per Game":"場均籃板","Assists Per Game":"場均助攻","Steals Per Game":"場均抄截","Blocks Per Game":"場均阻攻","Field Goal Percentage":"投籃命中率","Three Point Percentage":"三分命中率","Free Throw Percentage":"罰球命中率","Games Played":"出賽","Minutes Per Game":"場均時間","Points":"得分","Rebounds":"籃板","Assists":"助攻","Steals":"抄截","Blocks":"阻攻"};
const STATUSZH={"Scheduled":"未開打","Final":"終了","Halftime":"中場休息","In Progress":"進行中","Postponed":"延期","Canceled":"取消","End of Period":"節間休息"};

let lang=localStorage.getItem("nbaLang")||"en";
let tab="scores",date=new Date(),timer=null,view=null;
const t=k=>T[lang][k]||k;
const tn=(abbr,name)=>lang==="zh"&&TEAMZH[abbr]?TEAMZH[abbr]:name;
const API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const $=document.getElementById("app");

async function get(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json()}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");

function toggleLang(){lang=lang==="en"?"zh":"en";localStorage.setItem("nbaLang",lang);document.documentElement.lang=lang==="zh"?"zh-Hant":"en";render()}
function drawNav(){
 const items=[["scores","🏀"],["standings","📊"],["teams","🛡️"],["players","👤"],["news","📰"]];
 document.getElementById("nav").innerHTML=items.map(([k,i])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${i}<br>${t(k)}</button>`).join("");
 document.getElementById("lang").textContent=lang==="en"?"中文":"English";
}
function go(k){tab=k;view=null;render()}
function render(){
 clearInterval(timer);drawNav();
 $.innerHTML=`<div class="card">${t("loading")}</div>`;
 const f={scores:pgScores,standings:pgStandings,teams:pgTeams,players:pgPlayers,news:pgNews}[tab];
 f().catch(()=>{$.innerHTML=`<div class="err">${t("err")}</div>`});
}

/* SCORES */
async function pgScores(){
 if(view){return pgGame(view)}
 const load=async()=>{
  const d=await get(`${API}/scoreboard?dates=${ymd(date)}`);
  const ev=d.events||[];
  let h=`<div class="row"><button class="tabs" style="background:#252c3d;color:#fff;border:0;padding:8px;border-radius:8px" onclick="shift(-1)">${t("prev")}</button>
   <b onclick="date=new Date();render()">${date.toLocaleDateString(lang==="zh"?"zh-TW":"en-US",{month:"short",day:"numeric",weekday:"short"})}</b>
   <button style="background:#252c3d;color:#fff;border:0;padding:8px;border-radius:8px" onclick="shift(1)">${t("next")}</button></div>
   <p style="font-size:12px;color:#889;margin:6px 0">${t("auto")} · ${t("tapNote")}</p>`;
  if(!ev.length)h+=`<div class="card">${t("nogame")}</div>`;
  h+=ev.map(e=>{
   const c=e.competitions[0],s=e.status.type,live=s.state==="in";
   const st=live?`<span class="live">● ${t("live")} ${e.status.displayClock||""} Q${e.status.period}</span>`:
     s.state==="post"?t("final"):new Date(e.date).toLocaleTimeString(lang==="zh"?"zh-TW":"en-US",{hour:"2-digit",minute:"2-digit"});
   const tm=c.competitors.slice().sort((a,b)=>a.homeAway==="away"?-1:1).map(x=>`
    <div class="row"><div class="team"><img src="${x.team.logo||""}"><span>${tn(x.team.abbreviation,x.team.displayName)}</span><small style="color:#889">${x.records?.[0]?.summary||""}</small></div>
    <span class="sc">${s.state==="pre"?"":x.score}</span></div>`).join("");
   return `<div class="card game" onclick="view='${e.id}';render()"><div class="st">${st}</div>${tm}</div>`}).join("");
  $.innerHTML=h;
 };
 await load();
 timer=setInterval(()=>load().catch(()=>{}),30000);
}
function shift(n){date.setDate(date.getDate()+n);render()}

async function pgGame(id){
 const d=await get(`${API}/summary?event=${id}`);
 let h=`<button class="back" onclick="view=null;render()">${t("back")}</button>`;
 const c=d.header?.competitions?.[0];
 if(c)h+=`<div class="card">`+c.competitors.map(x=>`<div class="row"><div class="team"><img src="${x.team.logos?.[0]?.href||""}"><b>${tn(x.team.abbreviation,x.team.displayName)}</b></div><span class="sc">${x.score||""}</span></div>`).join("")+`</div>`;
 (d.boxscore?.players||[]).forEach(tp=>{
  const st=tp.statistics?.[0];if(!st)return;
  const lab=st.labels;
  h+=`<div class="card"><b>${tn(tp.team.abbreviation,tp.team.displayName)} · ${t("box")}</b><div class="scroll"><table><tr><th></th>${lab.map(l=>`<th>${l}</th>`).join("")}</tr>`+
   st.athletes.map(a=>`<tr><td>${a.athlete.shortName}</td>${(a.stats.length?a.stats:lab.map(()=>"-")).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")+`</table></div></div>`;
 });
 if(!d.boxscore?.players?.length)h+=`<div class="card">${t("nogame")}</div>`;
 $.innerHTML=h;
 timer=setInterval(()=>{if(tab==="scores"&&view)pgGame(view).catch(()=>{})},30000);
}

/* STANDINGS */
async function pgStandings(){
 const d=await get("https://site.api.espn.com/apis/v2/sports/basketball/nba/standings");
 let h="";
 (d.children||[]).forEach(conf=>{
  const name=/east/i.test(conf.name)?t("east"):t("west");
  const en=conf.standings.entries.slice().sort((a,b)=>{
   const g=x=>+(x.stats.find(s=>s.name==="playoffSeed")?.value||99);return g(a)-g(b)});
  const gs=(e,n)=>e.stats.find(s=>s.name===n)?.displayValue??"-";
  h+=`<div class="card"><b>${name}</b><div class="scroll"><table><tr><th>${t("team")}</th><th>${t("w")}</th><th>${t("l")}</th><th>${t("pct")}</th><th>${t("gb")}</th><th>${t("streak")}</th></tr>`+
  en.map((e,i)=>`<tr><td>${i+1}. <img src="${e.team.logos?.[0]?.href||""}" width="18" style="vertical-align:middle"> ${tn(e.team.abbreviation,e.team.shortDisplayName)}</td><td>${gs(e,"wins")}</td><td>${gs(e,"losses")}</td><td>${gs(e,"winPercent")}</td><td>${gs(e,"gamesBehind")}</td><td>${gs(e,"streak")}</td></tr>`).join("")+`</table></div></div>`;
 });
 $.innerHTML=h||`<div class="card">${t("nogame")}</div>`;
}

/* TEAMS */
async function pgTeams(){
 if(view)return pgTeam(view);
 const d=await get(`${API}/teams`);
 const ts=d.sports[0].leagues[0].teams.map(x=>x.team);
 $.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`+ts.map(x=>`<div class="card game" style="text-align:center" onclick="view='${x.id}';render()"><img src="${x.logos?.[0]?.href||""}" width="48"><div>${tn(x.abbreviation,x.displayName)}</div></div>`).join("")+`</div>`;
}
async function pgTeam(id){
 const [r,tm]=await Promise.all([get(`${API}/teams/${id}/roster`),get(`${API}/teams/${id}`)]);
 const x=tm.team;
 let h=`<button class="back" onclick="view=null;render()">${t("back")}</button>
 <div class="card big"><img src="${x.logos?.[0]?.href||""}"><div><h2>${tn(x.abbreviation,x.displayName)}</h2><div style="color:#9ab">${x.record?.items?.[0]?.summary||""} · ${x.standingSummary||""}</div></div></div>
 <div class="card"><b>${t("roster")}</b><div class="scroll"><table><tr><th></th><th>${t("pos")}</th><th>${t("age")}</th><th>${t("ht")}</th></tr>`+
 (r.athletes||[]).map(a=>`<tr onclick="openPlayer('${a.id}')" style="cursor:pointer"><td>#${a.jersey||"-"} ${a.fullName}</td><td>${lang==="zh"?(POSZH[a.position?.abbreviation]||a.position?.abbreviation):a.position?.abbreviation||""}</td><td>${a.age||""}</td><td>${a.displayHeight||""}</td></tr>`).join("")+`</table></div></div>`;
 $.innerHTML=h;
}
function openPlayer(id){tab="players";view=id;render()}

/* PLAYERS */
async function pgPlayers(){
 if(view)return pgPlayer(view);
 $.innerHTML=`<input id="q" placeholder="${t("search")}" oninput="doSearch(this.value)"><div id="res"></div>`;
}
let st;
function doSearch(v){
 clearTimeout(st);
 st=setTimeout(async()=>{
  const res=document.getElementById("res");if(v.length<2){res.innerHTML="";return}
  try{
   const d=await get(`https://site.web.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(v)}&limit=10&type=player&sport=basketball&league=nba`);
   const it=d.items||[];
   res.innerHTML=it.length?it.map(p=>`<div class="card game" onclick="view='${p.id}';render()"><b>${p.displayName}</b><div style="color:#9ab;font-size:13px">${p.subtitle||""}</div></div>`).join(""):`<div class="card">${t("noresult")}</div>`;
  }catch(e){res.innerHTML=`<div class="err">${t("err")}</div>`}
 },400);
}
async function pgPlayer(id){
 const [o,b]=await Promise.all([
  get(`https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${id}/overview`),
  get(`https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${id}`).catch(()=>null)]);
 const a=b?.athlete||{};
 let h=`<button class="back" onclick="view=null;render()">${t("back")}</button>
 <div class="card big"><img src="${a.headshot?.href||""}"><div><h2>${a.displayName||""}</h2>
 <div style="color:#9ab">${a.team?tn(a.team.abbreviation,a.team.displayName):""} · #${a.jersey||"-"} · ${lang==="zh"?(POSZH[a.position?.abbreviation]||""):a.position?.displayName||""}</div>
 <div style="color:#9ab;font-size:13px">${a.displayHeight||""} · ${a.displayWeight||""} · ${a.age||""}</div></div></div>`;
 const s=o.statistics;
 if(s){
  h+=`<div class="card"><b>${t("seasonStats")}</b><div class="scroll"><table><tr><th></th>${s.labels.map(l=>`<th>${l}</th>`).join("")}</tr>`+
  s.splits.map(sp=>`<tr><td>${sp.displayName}</td>${sp.stats.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")+`</table></div></div>`;
 }
 if(!s)h+=`<div class="card">${t("noresult")}</div>`;
 $.innerHTML=h;
}

/* NEWS */
async function pgNews(){
 const d=await get(`${API}/news?limit=20`);
 $.innerHTML=(d.articles||[]).map(a=>`<div class="card news">${a.images?.[0]?`<img src="${a.images[0].url}">`:""}<b>${a.headline}</b><p style="font-size:13px;color:#aab;margin:6px 0">${a.description||""}</p><a href="${a.links?.web?.href}" target="_blank" rel="noopener">${t("readmore")}</a></div>`).join("")||`<div class="card">${t("noresult")}</div>`;
}
document.documentElement.lang=lang==="zh"?"zh-Hant":"en";
render();
</script>
</body>
</html>
